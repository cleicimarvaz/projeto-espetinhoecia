<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comandas - Espetinho & Cia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .logo-depth { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="comandas-page" class="bg-slate-50 font-sans pb-32">

    <header class="bg-[#e63946] fixed top-0 w-full z-50 px-5 py-4 shadow-xl flex justify-between items-center h-20 rounded-b-[1.5rem]">
        <div class="flex items-center gap-2">
            <button class="text-white text-2xl font-black mr-2 active:scale-95 transition-all">←</button>
            <img src="img/logo.jpg" alt="Logo" class="w-12 h-12 rounded-full border-2 border-white/30 logo-depth object-cover">
            <h1 class="text-white font-black italic text-sm uppercase leading-none tracking-tighter drop-shadow-md">
                GESTÃO DE MESAS
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="header-usuario" class="text-white font-black text-[10px] uppercase italic opacity-90 tracking-wider text-right"></span>
        </div>
    </header>

    <div class="pt-28 px-6">
        
        <div class="flex bg-white p-1 rounded-full shadow-sm border border-slate-100 mb-6">
            <button id="btn-comanda-lista" onclick="alternarAbasComanda('lista')" class="flex-1 py-3 rounded-full bg-[#e63946] text-white text-[9px] font-black uppercase transition-all font-sans italic tracking-widest shadow-sm">ATIVAS</button>
            <button id="btn-comanda-abrir" onclick="alternarAbasComanda('abrir')" class="flex-1 py-3 rounded-full bg-transparent text-slate-400 text-[9px] font-black uppercase transition-all font-sans italic tracking-widest hover:bg-slate-50">NOVA</button>
        </div>

        <div id="aba-lista-comanda" class="space-y-4 pb-20">
            <div id="lista-comandas-ativas"></div>
        </div>

        <div id="aba-abrir-comanda" class="hidden bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 space-y-4">
            <div>
                <label class="block text-[9px] font-black text-slate-400 uppercase italic mb-1 font-sans tracking-wide">Identificação (Mesa/Nome)</label>
                <input type="text" id="c-identificacao" placeholder="EX: MESA 01" class="w-full bg-slate-50 p-4 rounded-xl text-xs font-bold text-slate-700 border-2 border-slate-100 focus:border-[#e63946] outline-none transition-colors uppercase font-sans">
            </div>
            <button onclick="abrirNovaComanda()" class="w-full bg-slate-800 text-white py-4 rounded-xl text-[10px] font-black uppercase italic tracking-widest active:scale-95 transition-all shadow-lg mt-4 font-sans">ABRIR COMANDA</button>
        </div>
    </div>

<div id="modal-detalhes-comanda" class="hidden fixed inset-0 bg-slate-900/95 z-[60] flex items-end sm:items-center justify-center backdrop-blur-md">
        <div class="bg-white w-full sm:w-96 rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 animate-slide-up max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl flex flex-col">
            
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="text-[#e63946] font-black text-xl italic uppercase">DETALHES</h3>
                    <p id="titulo-detalhes-mesa" class="text-xs font-bold text-slate-400 uppercase"></p>
                </div>
                <button onclick="fecharDetalhesComanda()" class="bg-slate-100 w-8 h-8 rounded-full text-slate-400 font-bold hover:bg-slate-200 transition-all">✕</button>
            </div>

            <div id="lista-itens-detalhes" class="bg-slate-50 p-4 rounded-2xl mb-4 border border-slate-100 max-h-60 overflow-y-auto text-slate-600 space-y-2 text-[10px]"></div>

            <div class="flex justify-between items-end mb-6 px-2">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">TOTAL PARCIAL</span>
                <span id="total-detalhes" class="text-3xl font-black text-slate-800 tracking-tighter">R$ 0,00</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="btn-add-item-modal" class="h-14 rounded-xl bg-white border-2 border-slate-100 flex flex-row items-center justify-center gap-2 active:bg-slate-50 transition-all hover:border-slate-300 shadow-sm text-slate-600">
                     <span class="text-lg">🛒</span><span class="text-[11px] font-black uppercase tracking-tighter">Lançar</span>
                </button>
                <button id="btn-pagar-modal-detalhes" class="h-14 rounded-xl bg-emerald-500 border border-emerald-600 flex flex-row items-center justify-center gap-2 active:bg-emerald-600 transition-all shadow-md shadow-emerald-200 text-white">
                     <span class="text-lg">💲</span><span class="text-[11px] font-black uppercase tracking-tighter">Pagar</span>
                </button>
            </div>
        </div>
    </div>

    <div id="modal-fechamento" class="hidden fixed inset-0 bg-slate-900/95 z-[60] flex items-end sm:items-center justify-center backdrop-blur-md">
        <div class="bg-white w-full sm:w-96 rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 animate-slide-up max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl">
            
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="text-[#e63946] font-black text-xl italic uppercase">FECHAMENTO</h3>
                    <p id="titulo-fechamento-mesa" class="text-xs font-bold text-slate-400 uppercase"></p>
                </div>
                <button onclick="fecharModalFechamento()" class="bg-slate-100 w-8 h-8 rounded-full text-slate-400 font-bold">✕</button>
            </div>

            <div id="lista-itens-fechamento" class="bg-slate-50 p-4 rounded-2xl mb-4 border border-slate-100 max-h-40 overflow-y-auto text-slate-600 space-y-2 text-[10px]"></div>

            <div class="flex justify-between items-end mb-6 px-2">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">TOTAL A PAGAR</span>
                <span id="total-fechamento" class="text-3xl font-black text-slate-800 tracking-tighter">R$ 0,00</span>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-[9px] font-black text-slate-400 uppercase italic mb-1">Forma Pagto</label>
                    <select id="forma-pagamento-fechamento" onchange="handlePagamentoFechamentoChange()" class="w-full bg-slate-50 p-3 rounded-xl text-xs font-bold text-slate-700 border-2 border-slate-100 outline-none uppercase">
                        <option value="Pix">💠 Pix</option>
                        <option value="Dinheiro">💵 Dinheiro</option>
                        <option value="Credito">💳 Crédito</option>
                        <option value="Debito">💳 Débito</option>
                    </select>
                </div>
                <div id="container-recebido-fechamento" class="opacity-50 pointer-events-none transition-all">
                    <label class="block text-[9px] font-black text-slate-400 uppercase italic mb-1">Recebido (R$)</label>
                    <input type="tel" id="valor-recebido-fechamento" oninput="mascaraMoeda(event); calcularTrocoFechamento()" placeholder="0,00" class="w-full bg-white p-3 rounded-xl text-xl font-black text-center text-slate-800 border-2 border-slate-100 outline-none">
                </div>
            </div>

            <div id="area-troco-fechamento" class="hidden mb-6 border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center bg-slate-50/50">
                <p id="label-troco-fechamento" class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">TROCO DO CLIENTE</p>
                <p id="valor-troco-fechamento" class="text-2xl font-black text-emerald-500">R$ 0,00</p>
            </div>

            <button onclick="confirmarFechamento()" class="w-full bg-[#e63946] text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest shadow-lg shadow-red-200 active:scale-95 transition-all">
                CONFIRMAR E FECHAR
            </button>
        </div>
    </div>

    <div id="modal-confirmacao-impressao" class="hidden fixed inset-0 bg-slate-900/95 z-[70] items-center justify-center px-6 backdrop-blur-md">
        <div class="bg-white w-full max-w-[320px] rounded-[3rem] p-8 text-center shadow-2xl border-4 border-white">
            <div class="bg-emerald-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🖨️</div>
            <h3 class="text-slate-800 font-black text-sm uppercase mb-2">Imprimir Comprovante?</h3>
            <p class="text-[10px] font-bold text-slate-400 mb-8">Deseja imprimir o cupom para o cliente?</p>
            <div class="flex gap-4">
                <button onclick="fecharModalImpressao()" class="flex-1 bg-slate-100 py-4 rounded-[1.5rem] text-[9px] font-black text-slate-500">NÃO</button>
                <button onclick="confirmarImpressaoAction()" class="flex-1 bg-emerald-500 text-white py-4 rounded-[1.5rem] text-[9px] font-black shadow-lg shadow-emerald-200">SIM</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white p-4 pb-6 rounded-t-[2.5rem] shadow-[0_-5px_20px_rgba(0,0,0,0.1)] border-t border-slate-100 z-50">
        <div class="flex justify-around items-center">
            <a href="home.html" id="nav-home" class="flex flex-col items-center gap-1 transition-all text-slate-300 hover:text-slate-500"><span class="text-xl">🏠</span><span class="text-[9px] font-black uppercase tracking-wide font-sans">Início</span></a>
            <a href="venda.html" id="nav-venda" class="flex flex-col items-center gap-1 transition-all text-slate-300 hover:text-slate-500"><span class="text-xl">🛒</span><span class="text-[9px] font-black uppercase tracking-wide font-sans">Vendas</span></a>
            <a href="comandas.html" id="nav-comandas" class="flex flex-col items-center gap-1 transition-all text-[#e63946]"><span class="text-xl">📋</span><span class="text-[9px] font-bold uppercase tracking-wide font-sans">Comandas</span></a>
            <a href="configuracoes.html" id="nav-admin" class="flex flex-col items-center gap-1 transition-all text-slate-300 hover:text-slate-500"><span class="text-xl">⚙️</span><span class="text-[9px] font-black uppercase tracking-wide font-sans">Painel</span></a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
</body>
</html>
