<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Espetinho & Cia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sombra suave para dar profundidade na logo igual ao app */
        .logo-depth { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#e63946] flex items-center justify-center min-h-screen p-6">

    <div class="bg-white w-full max-w-[340px] rounded-[2.5rem] p-8 pt-12 shadow-2xl flex flex-col items-center relative animate-fade-in-up">
        
        <div class="absolute -top-12 bg-white p-2 rounded-full shadow-lg">
            <img src="img/logo.jpg" alt="Logo Espetinho & Cia" class="w-24 h-24 rounded-full border-4 border-slate-50 object-cover logo-depth">
        </div>

        <h1 class="mt-10 text-[#e63946] text-2xl font-black italic tracking-tighter mb-1 uppercase drop-shadow-sm">ESPETINHO & CIA</h1>
        <p class="text-slate-300 text-[9px] font-black uppercase tracking-[0.2em] mb-8">Sistema de Gestão</p>

        <div class="w-full space-y-4">
            <div>
                <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-3 italic">Usuário</label>
                <input type="text" id="user" placeholder="SEU USUÁRIO" 
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-xs font-bold text-slate-700 outline-none focus:border-[#e63946] transition-colors uppercase font-sans placeholder:text-slate-300">
            </div>

            <div>
                <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-3 italic">Senha</label>
                <input type="password" id="pass" placeholder="••••••••" 
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-xs font-bold text-slate-700 outline-none focus:border-[#e63946] transition-colors font-sans placeholder:text-slate-300">
            </div>

            <button onclick="fazerLogin()" 
                class="w-full bg-[#e63946] text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-red-200 active:scale-95 transition-all mt-4 border-2 border-white">
                ENTRAR NO SISTEMA
            </button>
        </div>

        <p class="text-slate-300 text-[8px] mt-10 font-black uppercase tracking-widest opacity-60">
            Desenvolvido por Cleicimar Vaz
        </p>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
