<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reserva de Mesas | Espetinho & Cia</title>
    
    <link rel="icon" type="image/jpeg" href="img/logo.jpg?v=2">
    <link rel="apple-touch-icon" href="img/logo.jpg?v=2">
    <meta name="theme-color" content="#0f172a"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans p-4">

    <div id="app" class="max-w-md mx-auto space-y-6 animate-fade-in">
        
        <div id="evento-info" class="text-center">
            <h1 id="ev-nome" class="text-2xl font-black uppercase tracking-tighter text-slate-900">Carregando...</h1>
            <p id="ev-data" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1"></p>
            
            <div class="mt-4 inline-block bg-emerald-100 text-emerald-800 px-6 py-2 rounded-full font-black text-xs uppercase tracking-widest">
                Valor por mesa: R$ <span id="ev-valor">0,00</span>
            </div>
        </div>

        <div id="container-mapa-reserva" class="hidden">
            <button type="button" onclick="window.abrirModalMapa()" class="w-full bg-white hover:bg-slate-100 border-2 border-slate-200 text-slate-700 font-black py-4 rounded-[1.5rem] text-[11px] uppercase tracking-widest shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2">
                🗺️ Ver Mapa das Mesas
            </button>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
            <h3 class="font-black text-slate-400 uppercase text-[10px] tracking-widest mb-4 border-b border-slate-100 pb-2">Selecione sua(s) mesa(s)</h3>
            
            <div id="grade-mesas" class="grid grid-cols-5 gap-2"></div>
            
            <div class="mt-6 p-4 bg-emerald-600 rounded-xl text-white text-center font-black shadow-lg shadow-emerald-600/20">
                TOTAL A PAGAR: R$ <span id="valor-total">0,00</span>
            </div>
        </div>

        <form id="form-reserva-cliente" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 space-y-4">
            <h3 class="font-black text-slate-800 uppercase text-[10px] tracking-widest">Finalizar Reserva</h3>
            
            <input type="text" id="cli-nome" required placeholder="Seu Nome Completo" class="w-full bg-slate-50 border border-slate-100 rounded-xl p-4 font-bold text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <input type="tel" id="cli-tel" required placeholder="(00) 00000-0000" maxlength="15" oninput="aplicarMascaraTelefone(this)" class="w-full bg-slate-50 border border-slate-100 rounded-xl p-4 font-bold text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            
            <div class="space-y-2 pt-2">
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Anexar Comprovante PIX</label>
                <input type="file" id="cli-comprovante" accept="image/*" class="w-full text-xs font-bold text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-black file:bg-slate-100 cursor-pointer">
                <p class="text-[10px] font-bold text-amber-500 italic">⚠️ ATENÇÂO: O comprovante pode ser anexado e enviado agora ou ser encaminhado pelo WhatsApp.</p>
            </div>
            
            <button type="submit" id="btn-enviar" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-xl uppercase tracking-widest transition-all active:scale-95 shadow-lg">
                FINALIZAR RESERVA
            </button>
        </form>
    </div>

    <div id="modal-mapa-evento" class="hidden fixed inset-0 z-[150] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-sm animate-fade-in">
        <div class="w-full max-w-md bg-white rounded-[2rem] p-2 relative flex flex-col animate-slide-up">
            <button onclick="window.fecharModalMapa()" class="absolute -top-12 right-0 text-white text-3xl font-black hover:scale-110 transition-transform drop-shadow-md">✕</button>
            <div class="overflow-hidden rounded-[1.5rem] bg-slate-100 flex items-center justify-center">
                <img id="img-mapa-modal" src="" alt="Mapa do Evento" class="w-full h-auto object-contain max-h-[75vh]">
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="componentes/config.js"></script>
    <script src="componentes/database.js"></script>
    <script src="componentes/ui.js"></script>
    <script src="componentes/reserva.js"></script>
</body>
</html>
