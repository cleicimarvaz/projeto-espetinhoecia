<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Espetinho & Cia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>.logo-depth { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }</style>
</head>
<body id="home-page" class="bg-slate-50 font-sans pb-32">

    <header class="bg-[#e63946] fixed top-0 w-full z-50 px-5 py-4 shadow-xl flex justify-between items-center h-20 rounded-b-[1.5rem]">
        <div class="flex items-center gap-3">
            <img src="img/logo.jpg" alt="Logo" class="w-12 h-12 rounded-full border-2 border-white/30 logo-depth object-cover">
            <h1 class="text-white font-black italic text-sm uppercase leading-none tracking-tighter drop-shadow-md">ESPETINHO & CIA</h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="header-usuario" class="text-white font-black text-[10px] uppercase italic opacity-90 tracking-wider text-right"></span>
            <button onclick="logout()" class="bg-white/20 text-white px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm active:bg-white/30 transition-all border border-white/10">SAIR</button>
        </div>
    </header>

    <div class="pt-28 px-6">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col items-center justify-center text-center mb-6">
            <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-1 italic">FATURAMENTO HOJE</p>
            <h3 id="faturamento-hoje" class="text-5xl font-black italic text-[#e63946] tracking-tighter">R$ 0,00</h3>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="window.location.href='venda.html'" class="bg-white h-36 rounded-[2.5rem] shadow-sm border-2 border-white flex flex-col items-center justify-center gap-3 active:scale-95 transition-all"><div class="bg-orange-50 w-12 h-12 rounded-full flex items-center justify-center text-2xl">🛒</div><h4 class="font-black text-slate-800 text-[10px] uppercase italic tracking-tighter">NOVA VENDA</h4></button>
            <button onclick="window.location.href='comandas.html'" class="relative bg-white h-36 rounded-[2.5rem] shadow-sm border-2 border-white flex flex-col items-center justify-center gap-3 active:scale-95 transition-all"><div class="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center text-2xl">📋</div><h4 class="font-black text-slate-800 text-[10px] uppercase italic tracking-tighter">COMANDAS</h4><div id="badge-comandas" class="hidden absolute top-4 right-4 bg-[#e63946] text-white font-black text-[10px] w-6 h-6 flex items-center justify-center rounded-full border-2 border-white shadow-md animate-bounce">0</div></button>
            
            <button id="btn-home-admin" onclick="window.location.href='configuracoes.html'" class="bg-white h-36 rounded-[2.5rem] shadow-sm border-2 border-white flex flex-col items-center justify-center gap-3 active:scale-95 transition-all"><div class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-2xl">⚙️</div><h4 class="font-black text-slate-800 text-[10px] uppercase italic tracking-tighter">PAINEL ADMINISTRATIVO</h4></button>
            
            <button onclick="logout()" class="bg-white h-36 rounded-[2.5rem] shadow-sm border-2 border-white flex flex-col items-center justify-center gap-3 active:scale-95 transition-all group"><div class="bg-red-50 w-12 h-12 rounded-full flex items-center justify-center text-2xl group-active:bg-red-100 text-red-500">🚪</div><h4 class="font-black text-slate-800 text-[10px] uppercase italic tracking-tighter text-red-500">SAIR</h4></button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white p-4 pb-6 rounded-t-[2.5rem] shadow-[0_-5px_20px_rgba(0,0,0,0.1)] border-t border-slate-100 z-50">
        <div class="flex justify-around items-center">
            <a href="home.html" id="nav-home" class="flex flex-col items-center gap-1 transition-all text-[#e63946]"><span class="text-xl">🏠</span><span class="text-[9px] font-black uppercase tracking-wide">Início</span></a>
            <a href="venda.html" id="nav-venda" class="flex flex-col items-center gap-1 transition-all text-slate-300 hover:text-slate-500"><span class="text-xl">🛒</span><span class="text-[9px] font-black uppercase tracking-wide">Vendas</span></a>
            <a href="comandas.html" id="nav-comandas" class="flex flex-col items-center gap-1 transition-all text-slate-300 hover:text-slate-500"><span class="text-xl">📋</span><span class="text-[9px] font-bold uppercase tracking-wide">Comandas</span></a>
            <a href="configuracoes.html" id="nav-admin" class="flex flex-col items-center gap-1 transition-all text-slate-300 hover:text-slate-500"><span class="text-xl">⚙️</span><span class="text-[9px] font-black uppercase tracking-wide">Painel</span></a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
</body>
</html>
