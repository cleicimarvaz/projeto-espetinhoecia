<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio - Espetinho & Cia</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo/icone-192.png">
    <meta name="theme-color" content="#e63946">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Espetinho & Cia">
    <link rel="apple-touch-icon" href="logo/icone-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .animate-pop { animation: pop 0.25s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .modal-scroll::-webkit-scrollbar { width: 4px; }
        .modal-scroll::-webkit-scrollbar-track { background: transparent; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="pb-10 select-none bg-slate-50">

    <div id="status-area" class="fixed top-4 left-0 w-full px-6 z-[100] pointer-events-none"></div>

<header class="p-6 pb-2 bg-white rounded-b-[2.5rem] shadow-sm mb-4 sticky top-0 z-40 border-b border-slate-100">
    <div class="flex justify-between items-center mb-6">
        <div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 italic">Peça agora no ESPETINHO</p>
            <h1 class="text-xl font-black text-red-600 tracking-tighter uppercase leading-none italic">ESPETINHO & CIA 🍢</h1>
        </div>
    </div>

    <div class="relative mb-6 flex items-center gap-2">
        <div class="relative flex-1">
            <i class="ph-bold ph-magnifying-glass absolute left-4 top-4 text-slate-300"></i>
            <input type="text" id="campo-busca" oninput="window.buscarProduto()" placeholder="Busque por produtos..." class="w-full bg-slate-50 p-4 pl-12 rounded-2xl text-xs font-bold text-slate-600 border border-slate-100 focus:border-red-200 transition-all outline-none">
        </div>
        <button onclick="window.alternarVisualizacao()" class="w-14 h-14 bg-white border border-slate-100 rounded-2xl flex items-center justify-center text-slate-400 shadow-sm active:scale-95 transition-all">
            <i id="icone-view" class="ph-bold ph-list text-xl"></i>
        </button>
    </div>

    <div class="flex gap-2.5 overflow-x-auto w-full custom-scrollbar pb-2">
        <button onclick="window.setCategoria('todos')" id="btn-cat-todos" class="btn-categoria bg-[#1e293b] text-white border border-[#1e293b] px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shrink-0 transition-all shadow-md">TODOS</button>
        
        <button onclick="window.setCategoria('espetos')" id="btn-cat-espetos" class="btn-categoria bg-white text-slate-400 border border-slate-200 px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shrink-0 transition-all hover:bg-slate-50">ESPETOS</button>
        
        <button onclick="window.setCategoria('cervejas')" id="btn-cat-cervejas" class="btn-categoria bg-white text-slate-400 border border-slate-200 px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shrink-0 transition-all hover:bg-slate-50">CERVEJAS</button>
        
        <button onclick="window.setCategoria('bebidas')" id="btn-cat-bebidas" class="btn-categoria bg-white text-slate-400 border border-slate-200 px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shrink-0 transition-all hover:bg-slate-50">BEBIDAS</button>
        
        <button onclick="window.setCategoria('combos')" id="btn-cat-combos" class="btn-categoria bg-white text-slate-400 border border-slate-200 px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shrink-0 transition-all hover:bg-slate-50">COMBOS</button>

        <button onclick="window.setCategoria('refeicao')" id="btn-cat-refeicao" class="btn-categoria bg-white text-slate-400 border border-slate-200 px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shrink-0 transition-all hover:bg-slate-50">REFEIÇÃO</button>

        <button onclick="window.setCategoria('acompanhamentos')" id="btn-cat-acompanhamentos" class="btn-categoria bg-white text-slate-400 border border-slate-200 px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shrink-0 transition-all hover:bg-slate-50">ACOMPANHAMENTOS</button>
    </div>
</header>

    <div id="cardapio" class="grid grid-cols-2 gap-4 px-4 pb-10"></div>

    <!-- Modal Detalhes (Sem botões de carrinho/quantidade) -->
<div id="modal-detalhes" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[110] flex items-end sm:items-center justify-center transition-all">
    <div onclick="event.stopPropagation()" class="bg-white w-full sm:max-w-md max-h-[85vh] rounded-t-[2.5rem] flex flex-col relative overflow-hidden shadow-2xl">
        <button onclick="window.fecharDetalhes()" class="absolute top-4 right-4 bg-black/20 backdrop-blur p-2 rounded-full z-50 text-white hover:bg-black/40 transition-colors">✕</button>
        
        <div class="flex-1 overflow-y-auto modal-scroll bg-slate-50">
            <div class="relative h-56 sm:h-72 bg-slate-200 overflow-hidden shrink-0">
                <div id="galeria-fotos-container" class="flex h-full w-full overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth"></div>
                <div id="indicador-fotos" class="absolute bottom-12 right-6 bg-black/50 backdrop-blur-md text-white text-[10px] font-black px-3 py-1 rounded-full z-20 uppercase tracking-widest hidden">1 / 1</div>
                <div class="absolute inset-0 bg-gradient-to-t from-slate-50 via-transparent to-transparent pointer-events-none"></div>
            </div>

            <div class="px-5 -mt-8 relative z-10 pb-6">
                <div class="bg-white rounded-[2rem] p-6 shadow-lg border border-slate-100">
                    <h2 id="det-nome" class="text-xl sm:text-2xl font-black text-slate-800 uppercase italic leading-tight tracking-tighter break-words">---</h2>
                    <span id="det-preco" class="text-3xl sm:text-4xl font-black text-red-600 block mt-1 italic tracking-tighter">R$ 0,00</span>
                    <p id="det-desc" class="text-[11px] font-bold text-slate-400 mt-3 uppercase leading-relaxed"></p>
                    
                    <div id="det-obs-container" class="hidden"></div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Scripts de Sistema (Na ordem correta) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <script src="componentes/config.js"></script>
    <script src="componentes/database.js"></script>
    <script src="componentes/cardapio.js"></script>
    <script src="componentes/utils.js"></script>
    <script src="componentes/ui.js"></script>
</body>
</html>
